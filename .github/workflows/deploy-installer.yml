# Build and publish the aliro-doorlock-esp32 installer to GitHub Pages.
#
# The installer is a small ESP Web Tools page. Its per-variant factory
# and app assets come from one matrix release on this repository. Direct
# browser fetches of release assets do not carry CORS headers, so this
# workflow downloads the verified assets and serves them from the same
# Pages origin.
#
# Phase 1B matrix flow:
#
# 1. Select exactly one published non-draft GitHub Release whose tag
#    matches the strict pattern `aliro-vX.Y.Z` with an optional
#    `-<suffix>` label. A requested or event tag must match exactly.
#    If no matching release exists, the workflow fails. It never
#    writes placeholder or empty manifests.
# 2. Download the complete five-file package for each variant
#    (`nanoc6-thread`, `nanoc6-wifi`, `atoms3-lite-wifi`) from that
#    release. Place the downloads in the layout
#    `<work>/assets/<TAG>/<VARIANT>/` that scripts/assemble_release.py
#    accepts.
# 3. Run `scripts/assemble_release.py` before preparing `_site`. The
#    assembler verifies every asset (sidecars, package manifest
#    identity, chip, 4 MiB factory size, embedded partition SHA at
#    0xC000, embedded app at 0x20000) and emits one factory + one
#    preserving-update manifest per variant. If any check fails, the
#    job fails before Pages is uploaded or deployed.
# 4. Copy the verified flat assembler output into `_site`, along with
#    the static installer HTML and JS and the built vendored
#    esp-web-tools files.
# 5. Alias `manifest.json` and `manifest-update.json` to the
#    nanoc6-thread manifests so the current installer UI keeps
#    working until a later task refreshes it. The aliases contain
#    real verified data; no placeholder is generated.
#
# The workflow also vendors esp-web-tools under
# installer/vendor/esp-web-tools (git submodule). The vendored branch
# carries only PR 733 (awaited onPostFlash callback) on top of upstream
# esphome/esp-web-tools main. The workflow builds it (npm ci +
# script/build) and copies dist/web/ into _site/vendor/dist/.
#
# Triggers:
#   - release: published (matrix tag prefix `aliro-v`)
#   - workflow_dispatch (manual, optional exact tag input)
#   - push to installer/**, firmware/variants.json,
#     scripts/assemble_release.py, or this file so a UI, matrix, or
#     assembler change republishes without waiting on a new firmware
#     release.

name: deploy-installer

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Matrix release tag to publish (empty = newest matching)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "installer/**"
      - "firmware/variants.json"
      - "scripts/assemble_release.py"
      - ".github/workflows/deploy-installer.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel in-flight Pages deploys; the second event waits for the
# first to finish rather than half-publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Only run for a matrix release tag, a manual dispatch, or a push
    # to a watched path. Other release tag prefixes are ignored.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'release' &&
       startsWith(github.event.release.tag_name, 'aliro-v'))
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout main with submodules
        uses: actions/checkout@v4
        with:
          ref: main
          # `recursive` pulls installer/vendor/esp-web-tools and any of
          # its own submodules.
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: installer/vendor/esp-web-tools/package-lock.json

      - name: Build vendored esp-web-tools
        # The fork's build script writes src/version.ts as a side
        # effect and then rebuilds. That is expected. If this step
        # errors with "cannot find module", the submodule is either
        # missing or empty. Run scripts/setup_vendor.sh locally, commit
        # the submodule reference, and retry.
        working-directory: installer/vendor/esp-web-tools
        run: |
          npm ci --loglevel=error --no-progress
          npm test
          bash script/build

      - name: Test installer integration
        run: node --test installer/tests/node-tests.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select the matrix release and download every variant
        id: matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ github.event.inputs.tag || '' }}
          EVENT_TAG: ${{ github.event.release.tag_name || '' }}
        # The step enumerates non-draft releases from the GitHub API,
        # picks exactly one that matches the strict matrix tag
        # pattern, and downloads the five files each variant requires
        # into work/assets/<TAG>/<VARIANT>/. Any missing file, wrong
        # count, or wrong pattern fails the job before Pages runs.
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          import sys
          import urllib.request
          from pathlib import Path

          TAG_PATTERN = re.compile(r"^aliro-v\d+\.\d+\.\d+(-[A-Za-z0-9._-]+)?$")
          REQUIRED_VARIANT_IDS = ("nanoc6-thread", "nanoc6-wifi", "atoms3-lite-wifi")

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          requested = os.environ.get("REQUESTED_TAG", "").strip()
          event = os.environ.get("EVENT_TAG", "").strip()

          def gh(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              return json.loads(urllib.request.urlopen(req, timeout=30).read())

          releases = []
          page = 1
          while True:
              batch = gh(f"https://api.github.com/repos/{repo}/releases?per_page=100&page={page}")
              if not batch:
                  break
              releases.extend(batch)
              if len(batch) < 100:
                  break
              page += 1

          def is_matrix(release):
              return (not release.get("draft") and
                      isinstance(release.get("tag_name"), str) and
                      TAG_PATTERN.match(release["tag_name"]))

          matching = [r for r in releases if is_matrix(r)]

          def die(message):
              print(f"::error::{message}")
              sys.exit(1)

          if requested:
              if not TAG_PATTERN.match(requested):
                  die(f"requested tag {requested!r} does not match aliro-vX.Y.Z pattern")
              selected = [r for r in matching if r["tag_name"] == requested]
              if not selected:
                  die(f"no published non-draft matrix release with tag {requested!r}")
              release = selected[0]
          elif event:
              if not TAG_PATTERN.match(event):
                  die(f"event tag {event!r} does not match aliro-vX.Y.Z pattern")
              selected = [r for r in matching if r["tag_name"] == event]
              if not selected:
                  die(f"event tag {event!r} has no matching published non-draft matrix release")
              release = selected[0]
          else:
              if not matching:
                  die("no published non-draft matrix release matches the aliro-vX.Y.Z pattern")
              matching.sort(key=lambda r: r["created_at"], reverse=True)
              release = matching[0]

          tag = release["tag_name"]
          print(f"Selected matrix release: {tag}")

          assets = {a["name"]: a for a in release.get("assets", [])}

          def download(asset):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/assets/{asset['id']}",
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/octet-stream"})
              return urllib.request.urlopen(req, timeout=180).read()

          work = Path("work") / "assets" / tag
          for variant_id in REQUIRED_VARIANT_IDS:
              stem = f"{tag}-{variant_id}"
              expected = [
                  f"{stem}-factory.bin",
                  f"{stem}-factory.bin.sha256",
                  f"{stem}-app.bin",
                  f"{stem}-app.bin.sha256",
                  f"{stem}-manifest.txt",
              ]
              variant_dir = work / variant_id
              variant_dir.mkdir(parents=True, exist_ok=True)
              for name in expected:
                  matches = [a for a in release["assets"] if a["name"] == name]
                  if len(matches) != 1:
                      die(f"variant {variant_id}: release {tag} must have exactly one {name} asset (got {len(matches)})")
                  data = download(matches[0])
                  if len(data) != matches[0]["size"]:
                      die(f"asset size mismatch on {name}: expected {matches[0]['size']}, downloaded {len(data)}")
                  (variant_dir / name).write_bytes(data)

          # Also refuse to proceed if the release contains extra
          # per-variant assets that do not belong to the matrix.
          # A stray file could sneak into a later assembler run.
          allowed = set()
          for variant_id in REQUIRED_VARIANT_IDS:
              stem = f"{tag}-{variant_id}"
              allowed.update([
                  f"{stem}-factory.bin", f"{stem}-factory.bin.sha256",
                  f"{stem}-app.bin", f"{stem}-app.bin.sha256",
                  f"{stem}-manifest.txt",
              ])
          extras = sorted(name for name in assets if name not in allowed)
          if extras:
              die(f"release {tag} carries assets outside the required matrix set: {extras}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as sink:
              sink.write(f"tag={tag}\n")
              sink.write(f"assets_dir={work.parent}\n")
          PY

      - name: Assemble the matrix release
        # The assembler verifies every downloaded package and writes a
        # single flat output directory with per-variant factory + app +
        # sidecars + factory manifest + update manifest. A failure here
        # exits non-zero and short-circuits Pages upload.
        run: |
          set -euo pipefail
          python3 scripts/assemble_release.py \
            --tag "${{ steps.matrix.outputs.tag }}" \
            --variants firmware/variants.json \
            --assets  "${{ steps.matrix.outputs.assets_dir }}" \
            --out     work/assembled

      - name: Prepare _site skeleton
        # Copy the assembled matrix output plus the static installer
        # into _site. The alias step below preserves the current UI's
        # `manifest.json` and `manifest-update.json` request paths.
        run: |
          set -euo pipefail
          mkdir -p _site _site/vendor _site/vendor/dist _site/js

          cp installer/index.html _site/index.html
          cp installer/js/*.js _site/js/
          cp installer/vendor/qrcode.js _site/vendor/qrcode.js
          cp -r installer/vendor/esp-web-tools/dist/web/* _site/vendor/dist/

          # .nojekyll is important — some file names include hashes with
          # leading underscores that Jekyll would filter out silently.
          touch _site/.nojekyll

          cp -R work/assembled/. _site/

      - name: Alias the current UI manifests to nanoc6-thread
        # installer/index.html and installer/js/device-settings.js
        # still request `manifest.json` and `manifest-update.json`.
        # Alias both to the verified nanoc6-thread manifests so the UI
        # keeps working until the next task refreshes it. The aliases
        # carry real verified data; nothing is generated.
        run: |
          set -euo pipefail
          test -f "_site/manifest-nanoc6-thread.json"
          test -f "_site/manifest-update-nanoc6-thread.json"
          cp "_site/manifest-nanoc6-thread.json" "_site/manifest.json"
          cp "_site/manifest-update-nanoc6-thread.json" "_site/manifest-update.json"

      - name: Dump _site contents for the run log
        run: |
          echo "==== _site tree ===="
          find _site -maxdepth 3 -print
          for manifest in _site/manifest*.json; do
            echo "==== $(basename "$manifest") ===="
            cat "$manifest" || true
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
